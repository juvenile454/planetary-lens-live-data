name: Update world fire feed

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - build_feed.py
      - test_build_feed.py
      - .github/workflows/update-fire-feed.yml

permissions:
  contents: write

concurrency:
  group: fire-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify filtering and failure handling
        run: python3 -m unittest -v test_build_feed.py
      - name: Build the bounded global feed
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python3 build_feed.py
      - name: Publish successful refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fire-hotspots.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh filtered world fire hotspots'
          git push origin HEAD:main
